server:
  port: 8080
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/peirs}
    username: ${SPRING_DATASOURCE_USERNAME:peirs}
    password: ${SPRING_DATASOURCE_PASSWORD:peirs_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
app:
  jwt-secret: ${JWT_SECRET:replace-this-with-a-long-random-secret-before-deployment-123456}
