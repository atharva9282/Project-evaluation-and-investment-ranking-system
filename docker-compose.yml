services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peirs}
      POSTGRES_USER: ${POSTGRES_USER:-peirs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peirs_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["peirs_data:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-peirs}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-peirs}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-peirs_dev_password}
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-secret-before-deployment-123456}
    depends_on:
      db: {condition: service_healthy}
    ports: ["8080:8080"]
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    depends_on: [backend]
    ports: ["5173:5173"]
volumes:
  peirs_data:
